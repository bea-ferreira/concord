<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concord · Rater calibration</title>
<meta name="description" content="Concord: rater calibration and data quality console. Independent prototype using synthetic demo data.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='8' fill='none' stroke='%232a5bd7' stroke-width='3'/%3E%3Ccircle cx='20' cy='16' r='8' fill='none' stroke='%231c1d1f' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --surface-2: #fbfaf7;
  --ink: #1b1c1e;
  --ink-2: #4f5157;
  --muted: #7d7f85;
  --line: #e3e1db;
  --line-2: #efede8;
  --accent: #2a5bd7;
  --accent-soft: #e9effc;
  --series-r6: #d0612a;
  --series-other: #bdbbb4;
  --good: #1d7a4c;
  --good-soft: #e7f3ec;
  --warn: #9a6200;
  --warn-soft: #fbf1dc;
  --bad: #b8332a;
  --bad-soft: #fbeae8;
  --band-good: #edf6f0;
  --band-warn: #fcf5e6;
  --band-bad: #fbefed;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(20,20,20,.04), 0 1px 1px rgba(20,20,20,.03);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
button { font: inherit; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
.banner { background: #1f2024; color: #e9e8e4; font-size: 12.5px; text-align: center; padding: 5px 16px; letter-spacing: .01em; }
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 18px 0 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
.brand .sub { color: var(--ink-2); font-size: 14px; }
.meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.meta b { color: var(--ink); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--line-2); color: var(--ink-2); border: 1px solid var(--line); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; }
nav.tabs button {
  border: 0; background: none; padding: 10px 14px 11px; color: var(--ink-2); cursor: pointer; font-weight: 500; white-space: nowrap;
  border-bottom: 2px solid transparent; border-radius: 0;
}
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
nav.tabs .num { display: inline-block; width: 18px; height: 18px; border-radius: 50%; font-size: 11px; line-height: 18px; text-align: center; background: var(--line-2); color: var(--ink-2); margin-right: 6px; }
nav.tabs button[aria-selected="true"] .num { background: var(--accent); color: #fff; }
main { padding: 26px 0 40px; }
.view { display: none; }
.view.active { display: block; }
h2 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
h3 { font-size: 16px; margin: 0 0 4px; }
h4 { font-size: 14px; margin: 0 0 6px; }
.lede { color: var(--ink-2); margin: 0 0 20px; max-width: 820px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow); min-width: 0; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g4 { grid-template-columns: repeat(4, 1fr); }
.g-5-7 { grid-template-columns: 5fr 7fr; }
.stack > * + * { margin-top: 18px; }
.section-title { margin: 30px 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.chart-title { font-weight: 600; font-size: 14.5px; margin: 0; }
.takeaway { margin: 2px 0 12px; font-size: 14px; color: var(--ink); }
.takeaway::before { content: "→ "; color: var(--accent); font-weight: 600; }
.note { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
svg { display: block; max-width: 100%; height: auto; overflow: visible; }
svg text { font-family: inherit; }
.axis text { fill: var(--muted); font-size: 11px; }
.axis line, .axis path { stroke: var(--line); }
.axis-label { fill: var(--ink-2); font-size: 11.5px; }
.grid-line { stroke: var(--line-2); }

/* legends */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.legend .lg { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; border: 1px solid var(--line); }
.legend i.ln { width: 18px; height: 0; border: 0; border-top: 2.5px solid; border-radius: 0; }

/* status */
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 2px 9px 2px 7px; border-radius: 999px; white-space: nowrap; }
.status svg { width: 13px; height: 13px; }
.status.good { color: var(--good); background: var(--good-soft); }
.status.warn { color: var(--warn); background: var(--warn-soft); }
.status.bad { color: var(--bad); background: var(--bad-soft); }
.status.neutral { color: var(--ink-2); background: var(--line-2); }

/* verdict */
.verdict { display: flex; gap: 16px; align-items: flex-start; border-left: 4px solid var(--bad); }
.verdict.ok { border-left-color: var(--good); }
.verdict .icon { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--bad-soft); color: var(--bad); display: grid; place-items: center; }
.verdict.ok .icon { background: var(--good-soft); color: var(--good); }
.verdict h2 { font-size: 21px; }
.verdict p { margin: 6px 0 0; color: var(--ink-2); max-width: 900px; }
.kpis { display: flex; gap: 28px; margin-top: 14px; flex-wrap: wrap; }
.kpi .v { font-size: 22px; font-weight: 650; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 12px; color: var(--muted); }

/* issue cards */
.issue { display: flex; flex-direction: column; gap: 8px; border-top: 3px solid var(--warn); }
.issue.bad { border-top-color: var(--bad); }
.issue .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.issue .who { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.issue h3 { font-size: 16.5px; }
.issue .evidence { margin: 0; font-size: 14px; }
.rule { font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; }
.rule b { color: var(--ink); }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; font-size: 14px; text-align: left; margin-top: auto; }
.link-btn:hover { text-decoration: underline; }

/* tables */
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }
tr.selected td { background: var(--accent-soft) !important; }
tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.flagged-val { color: var(--bad); font-weight: 600; }
.table-scroll { overflow-x: auto; }

/* chips / segmented */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; color: var(--ink-2); font-size: 13px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

.dimtiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.dimtile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; }
.dimtile:hover { border-color: #c9c6be; }
.dimtile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.dimtile .name { font-size: 13px; color: var(--ink-2); }
.dimtile .val { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; margin: 2px 0 4px; }

/* examples */
details.ex { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details.ex + details.ex { margin-top: 8px; }
details.ex summary { list-style: none; cursor: pointer; padding: 10px 14px; display: grid; grid-template-columns: 128px 1fr auto; gap: 12px; align-items: center; }
details.ex summary::-webkit-details-marker { display: none; }
details.ex summary .caret { transition: transform .15s; color: var(--muted); }
details.ex[open] summary .caret { transform: rotate(90deg); }
details.ex summary .id { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
details.ex summary .p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
details.ex .body { padding: 4px 14px 14px; border-top: 1px solid var(--line-2); }
.qa { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
.qa .lbl { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
.qa .txt { white-space: pre-wrap; font-size: 13.5px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 10px 12px; }
.scores { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.score { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 104px; }
.score .r { font-size: 12px; font-weight: 600; }
.score .s { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
.score .c { font-size: 11px; color: var(--muted); }
.score.pro { border-color: #b9c9f1; background: #f3f6fd; }
.score.user { border-color: #e6c3a9; background: #fcf5ef; }
.campkey { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
.campkey.pro { background: #b9c9f1; border: 1px solid #8ea6e3; }
.campkey.user { background: #f0d4bf; border: 1px solid #d9a983; }

/* guideline */
.guides { display: grid; grid-template-columns: 1fr 1.6fr; gap: 18px; }
.guide { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; background: var(--surface); }
.guide.orig { background: var(--surface-2); }
.guide .tag { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.guide.rev .tag { color: var(--accent); }
.guide blockquote { margin: 10px 0 0; font-size: 15px; }
.guide dl { margin: 10px 0 0; display: grid; grid-template-columns: 34px 1fr; gap: 6px 10px; font-size: 14px; }
.guide dt { font-weight: 700; font-variant-numeric: tabular-nums; background: var(--accent-soft); color: var(--accent); border-radius: 6px; text-align: center; height: 24px; line-height: 24px; }
.guide dd { margin: 0; }
.guide .worked { margin-top: 12px; font-size: 13.5px; border-top: 1px solid var(--line-2); padding-top: 10px; }
.guide .worked p { margin: 6px 0; }

/* memo */
.memo-actions { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink); display: inline-flex; gap: 8px; align-items: center; }
.btn:hover { border-color: #c9c6be; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.memo { max-width: 820px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 40px 48px; box-shadow: 0 2px 10px rgba(0,0,0,.04); font-size: 14.5px; }
.memo .mhead { border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 16px; display: grid; grid-template-columns: 70px 1fr; gap: 2px 10px; font-size: 13.5px; }
.memo .mhead .k { color: var(--muted); }
.memo h2 { font-size: 19px; margin-bottom: 12px; }
.memo h3 { font-size: 14.5px; margin: 16px 0 4px; }
.memo p { margin: 4px 0; }
.memo ol, .memo ul { margin: 4px 0; padding-left: 20px; }
.memo li { margin: 3px 0; }
.memo table { font-size: 13px; margin-top: 6px; }
.memo td, .memo th { padding: 4px 8px; }
.memo th { text-transform: none; letter-spacing: 0; font-size: 12px; }
.memo .ask { background: var(--accent-soft); border-radius: 6px; padding: 10px 14px; margin-top: 6px; }
.memo .foot { margin-top: 18px; font-size: 12px; color: var(--muted); }
.toast { font-size: 13px; color: var(--good); }

/* method */
.prose { max-width: 820px; }
.prose p, .prose li { color: var(--ink); }
.prose h3 { margin-top: 22px; }
.prose ul { padding-left: 20px; }
.prose code { font-size: 13px; background: var(--line-2); padding: 1px 5px; border-radius: 4px; }
.prose table { margin: 8px 0; }
.wc { font-size: 12px; color: var(--muted); }

/* tooltip */
#tip { position: fixed; z-index: 50; pointer-events: none; background: #1f2024; color: #f2f1ee; font-size: 12.5px; padding: 7px 10px; border-radius: 6px; max-width: 280px; opacity: 0; transition: opacity .08s; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
#tip.on { opacity: 1; }
#tip b { color: #fff; }
.hit { cursor: default; }

footer { border-top: 1px solid var(--line); padding: 18px 0 26px; font-size: 13px; color: var(--ink-2); }
footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

@media (max-width: 960px) {
  .g2, .g3, .g4, .g-5-7, .guides, .qa { grid-template-columns: 1fr; }
  .dimtiles { grid-template-columns: repeat(2, 1fr); }
  .memo { padding: 24px 20px; }
}
@media (max-width: 560px) {
  .wrap { padding: 0 16px; }
  details.ex summary { grid-template-columns: 1fr auto; }
  details.ex summary .id { display: none; }
}

@media print {
  @page { size: auto; margin: 11mm 13mm; }
  body { background: #fff; font-size: 10.5pt; }
  .banner, header.top, footer, .view:not(#view-summary), .memo-actions, .no-print, #tip { display: none !important; }
  main { padding: 0; }
  .wrap { max-width: none; padding: 0; }
  #view-summary { display: block !important; }
  .memo { border: 0; box-shadow: none; padding: 0; max-width: none; font-size: 9.2pt; line-height: 1.34; }
  .memo h2 { font-size: 13.5pt; margin-bottom: 6px; }
  .memo h3 { font-size: 10.2pt; margin: 7px 0 1px; }
  .memo .foot { margin-top: 8px; }
  .memo td, .memo th { padding: 2px 8px; }
  .memo .mhead { font-size: 9pt; padding-bottom: 6px; margin-bottom: 8px; }
  .memo table { font-size: 8.8pt; }
  .memo .ask { background: #f1f4fb; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<div class="banner">Prototype · synthetic data · built to show a calibration workflow</div>
<header class="top">
  <div class="wrap">
    <div class="top-inner">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><circle cx="12" cy="16" r="8" fill="none" stroke="#2a5bd7" stroke-width="2.6"/><circle cx="20" cy="16" r="8" fill="none" stroke="#1b1c1e" stroke-width="2.6"/></svg>
        <div><h1>Concord</h1><div class="sub">Rater calibration &amp; data quality console</div></div>
      </div>
      <div class="meta" id="meta"></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Views" id="tabs"></nav>
  </div>
</header>
<main class="wrap">
  <section class="view" id="view-overview" role="tabpanel"></section>
  <section class="view" id="view-raters" role="tabpanel"></section>
  <section class="view" id="view-rubric" role="tabpanel"></section>
  <section class="view" id="view-summary" role="tabpanel"></section>
  <section class="view" id="view-method" role="tabpanel"></section>
</main>
<footer><div class="wrap"><span>Prototype by Beatriz Ferreira · <a href="https://github.com/bea-ferreira" rel="noopener">GitHub</a></span><span>All customer names, items and ratings are synthetic demo data (seed 42).</span></div></footer>
<div id="tip" role="tooltip"></div>
<script id="engine">
/* ===================================================================
   Concord engine: synthetic data generator + metrics + flag rules.
   Pure functions, no DOM. Synthetic demo data, seed 42.
   =================================================================== */
var Engine = (function () {
  'use strict';

  var SEED = 42;
  var N_ITEMS = 240;
  var DRIFT_START = 131;           // R4 turns lenient from this sequence index
  var DRIFT_SHIFT = 0.9;
  var NOISE_SD = 0.4;
  var RATERS = ['R1', 'R2', 'R3', 'R4', 'R5', 'R6'];
  var DIMS = ['correctness', 'instruction_following', 'helpfulness', 'tone'];
  var DIM_LABEL = {
    correctness: 'Correctness',
    instruction_following: 'Instruction following',
    helpfulness: 'Helpfulness',
    tone: 'Tone'
  };
  var DIM_DEF = {
    correctness: 'Factually and technically accurate.',
    instruction_following: 'Does what the prompt asked.',
    helpfulness: 'Useful to the user.',
    tone: 'Tone is appropriate for the context.'
  };
  var CATS = ['coding', 'factual Q&A', 'advice', 'creative writing', 'summarization'];
  var BIAS = { R1: 0.15, R2: -0.2, R3: 0.05, R4: 0.1, R5: -0.1, R6: 0 };
  // How each rater reads the ambiguous tone guideline.
  var CAMP = { R1: 'pro', R3: 'pro', R2: 'user', R5: 'user', R4: 'none', R6: 'none' };
  var CAMP_LABEL = { pro: 'Professional-setting camp', user: "User's-context camp", none: 'No consistent reading' };
  var TIME_MEDIAN = { R1: 52, R2: 47, R3: 58, R4: 50, R5: 44, R6: 9 };

  var THRESH = { reliable: 0.8, tentative: 0.667 };
  var RULES = {
    windowSize: 30,
    agreeTolerance: 0.5,       // a rating "agrees" if within ±0.5 of the leave-one-out mean
    driftDrop: 0.2,
    driftRun: 30,
    rushTimeRatio: 0.4,
    rushGoldAcc: 0.7,
    ambiguousAlpha: 0.667,
    ambiguousOthers: 0.75
  };

  /* ---------- PRNG ---------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function makeGauss(rng) {
    var spare = null;
    return function () {
      if (spare !== null) { var s = spare; spare = null; return s; }
      var u = 0, v = 0;
      while (u === 0) u = rng();
      v = rng();
      var r = Math.sqrt(-2 * Math.log(u));
      spare = r * Math.sin(2 * Math.PI * v);
      return r * Math.cos(2 * Math.PI * v);
    };
  }
  function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
  function toScale(x) { return clamp(Math.round(x), 1, 5); }

  /* ---------- Hand-written items ---------- */
  // t: latent true scores [correctness, instruction_following, helpfulness, tone]
  // toneUser / tonePro: how each tone camp perceives the response (only for ambiguous items)
  var WRITTEN = [
    { seq: 3, category: 'coding', t: [5, 5, 5, 4],
      prompt: 'Write a Python function that returns the n-th Fibonacci number.',
      response: 'def fib(n):\n    """Return the n-th Fibonacci number (fib(0) = 0, fib(1) = 1)."""\n    if n < 0:\n        raise ValueError("n must be non-negative")\n    a, b = 0, 1\n    for _ in range(n):\n        a, b = b, a + b\n    return a\n\nThis runs in O(n) time and O(1) memory, so it handles large n without hitting the recursion limit.' },
    { seq: 9, category: 'factual Q&A', t: [5, 5, 5, 4],
      prompt: 'What causes the seasons on Earth?',
      response: "Seasons are caused by the tilt of Earth's axis, about 23.4° relative to its orbit. For part of the year one hemisphere leans toward the Sun and gets more direct sunlight and longer days (summer), while the other leans away (winter). It is not about distance: Earth is actually closest to the Sun in early January, during the Northern Hemisphere's winter." },
    { seq: 14, category: 'advice', t: [4, 5, 5, null], toneUser: 5, tonePro: 1.6, ambiguous: true,
      prompt: "ok real talk. I've been working 60 hr weeks for 3 months and I'm fried. how do I tell my manager I need to pull back without it sounding like I'm about to quit?? 😩",
      response: "Oof, 60-hour weeks for three months? Your brain deserves a medal and a nap. 😅 Here's a way to say it that's honest without sounding like you've got one foot out the door:\n\n1. Ask for a 1:1 and lead with commitment: \"I want to keep doing great work here, and the current pace isn't sustainable for me.\"\n2. Bring receipts: what you've shipped, and what's slipped because of the load.\n3. Come with a proposal, like moving one deadline or getting help with on-call.\n\nManagers hear \"here's a plan\" very differently from \"I'm drowning.\" You've got this. 💪" },

  /* ---------- Generator ---------- */
  function generate() {

    var gauss = makeGauss(rng);

    var cats = [];
    for (i = 0; i < N_ITEMS; i++) cats.push(CATS[i % CATS.length]);

  /* ---------- Statistics helpers ---------- */
  function mean(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return a.length ? s / a.length : NaN; }
  function median(a) { var b = a.slice().sort(function (x, y) { return x - y; }); var m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; }
  function sd(a) { var m = mean(a), s = 0; for (var i = 0; i < a.length; i++) s += (a[i] - m) * (a[i] - m); return Math.sqrt(s / a.length); }

    var mx = mean(x), my = mean(y), sxy = 0, sxx = 0, syy = 0;
    for (var i = 0; i < x.length; i++) { var a = x[i] - mx, b = y[i] - my; sxy += a * b; sxx += a * a; syy += b * b; }

  /* Krippendorff's alpha, interval metric (delta = (a-b)^2), with missing data.
     units: array of arrays of values (null/undefined = missing).
     Uses the identity  sum_{i!=j} (v_i - v_j)^2 = 2 (m * sum v^2 - (sum v)^2).            */
  function krippendorffInterval(units) {
    var n = 0, S = 0, SS = 0, Do = 0;
    for (var u = 0; u < units.length; u++) {
      var m = 0, s = 0, ss = 0;
      for (var k = 0; k < units[u].length; k++) { var v = units[u][k]; if (v === null || v === undefined) continue; m++; s += v; ss += v * v; }
      if (m < 2) continue;
      n += m; S += s; SS += ss;
      Do += 2 * (m * ss - s * s) / (m - 1);
    }
    if (n < 2) return NaN;
    Do /= n;
    var De = 2 * (n * SS - S * S) / (n * (n - 1));
    return De === 0 ? 1 : 1 - Do / De;
  }

  /* Reference implementation with an arbitrary distance function (pairwise, slow). Used by selfTest. */
  function krippendorffGeneric(units, delta) {
    var pairable = [], Do = 0;
    units.forEach(function (unit) {
      var vals = unit.filter(function (v) { return v !== null && v !== undefined; });
      if (vals.length < 2) return;
      for (var i = 0; i < vals.length; i++) for (var j = 0; j < vals.length; j++) if (i !== j) Do += delta(vals[i], vals[j]) / (vals.length - 1);
      pairable = pairable.concat(vals);
    });
    var n = pairable.length, De = 0;
    for (var i = 0; i < n; i++) for (var j = 0; j < n; j++) if (i !== j) De += delta(pairable[i], pairable[j]);

  }

  /* Quadratic-weighted Cohen's kappa on a fixed 1..K scale. */
  function weightedKappa(a, b, K) {
    K = K || 5;
    var O = [], ra = new Array(K).fill(0), rb = new Array(K).fill(0), n = 0, i, j;
    for (i = 0; i < K; i++) O.push(new Array(K).fill(0));
    for (i = 0; i < a.length; i++) {
      if (a[i] == null || b[i] == null) continue;
      O[a[i] - 1][b[i] - 1]++; ra[a[i] - 1]++; rb[b[i] - 1]++; n++;
    }
    var num = 0, den = 0;
    for (i = 0; i < K; i++) for (j = 0; j < K; j++) {
      var w = (i - j) * (i - j);
      num += w * O[i][j] / n;
      den += w * (ra[i] / n) * (rb[j] / n);
    }
    return den === 0 ? 1 : 1 - num / den;
  }

  /* ---------- Analysis ---------- */
  // opts: { exclude: {R6:true}, holdout: function(rid, seq) -> bool, toneSource: 'observed' | 'projected' }
  function getScore(data, rid, i, d, opts) {
    if (opts && opts.exclude && opts.exclude[rid]) return null;
    if (opts && opts.holdout && opts.holdout(rid, i + 1)) return null;
    if (d === 3 && opts && opts.toneSource === 'projected') return data.toneProjected[rid][i];
    return data.ratings[rid][i][d];
  }

  function alphaFor(data, dims, opts) {
    var units = [];
    dims.forEach(function (d) {
      for (var i = 0; i < data.items.length; i++) {
        units.push(RATERS.map(function (rid) { return getScore(data, rid, i, d, opts); }));
      }
    });
    return krippendorffInterval(units);
  }

  function analyze(data) {

    DIMS.forEach(function (name, d) { res.alpha[name] = alphaFor(data, [d]); });
    res.alpha.overall = alphaFor(data, dimIdx);

    // Leave-one-out consensus
    function loo(rid, i, d) {

    }).sort(function (a, b) { return Math.abs(b.gap) - Math.abs(a.gap) || b.sd - a.sd || a.index - b.index; });

  }

  }

      '<div class="memo-actions"><button class="btn primary" id="copy-memo">' + ICON.copy + 'Copy as text</button><button class="btn" id="print-memo">' + ICON.print + 'Print / Save as PDF</button><span class="toast" id="copy-toast" aria-live="polite"></span></div>';
    h += '<article class="memo" id="memo">' +
      '<div class="mhead"><span class="k">To</span><span>ML lead, Northwind AI</span><span class="k">From</span><span>Delivery team</span><span class="k">Project</span><span>Assistant response quality, batch 3</span><span class="k">Re</span><span>' + m.subject + '</span></div>' +
      '<h2>Batch 3: what we found and how we’re fixing it</h2>' +
      '<h3>What we checked</h3><p>' + m.checked + '</p>' +
      '<h3>What we found</h3><ol>' + m.findings.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ol>' +
      '<h3>What we’re doing about it</h3><ul>' + m.actions.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>' +
      '<h3>Impact on your data</h3><p><b>' + num(m.impact.affected) + ' of ' + num(m.impact.total) + ' ratings (' + pct(m.impact.share) + ')</b> will be replaced: ' + num(m.impact.byReason.rushing) + ' from ' + (RU || '—') + ', ' + num(m.impact.byReason.drift) + ' from ' + (DR || '—') + ' after item ' + (dSt ? dSt.breakPoint : '—') + ', and ' + num(m.impact.byReason.tone) + ' tone ratings. The other ' + num(m.impact.kept) + ' ratings stay as delivered. Expected reliability after the fixes:</p>' +
      '<table><thead><tr><th>Dimension</th><th class="num">α now</th><th class="num">α after fixes</th></tr></thead><tbody>' + m.afterRows.map(function (r) {
        return '<tr><td>' + r.label + '</td><td class="num">' + f2(r.now) + '</td><td class="num"><b>' + f2(r.after) + '</b>' + (r.projected ? ' <span class="wc">(projected)</span>' : '') + '</td></tr>';
      }).join('') + '</tbody></table>' +
      '<p style="margin-top:8px">' + m.interim + '</p>' +
      '<h3>Timeline</h3><p>' + m.timeline + '</p>' +
      '<h3>One question for you</h3><div class="ask">' + m.question + '</div>' +
      '<div class="foot">Thresholds: α ≥ 0.80 reliable, 0.667–0.80 tentative, &lt; 0.667 unreliable (Krippendorff). Tone after-fix value is projected until re-rating is complete. Synthetic demo data.</div>' +
      '</article>';
    $('#view-summary').innerHTML = h;
    $('#print-memo').addEventListener('click', function () { window.print(); });
    $('#copy-memo').addEventListener('click', function () {
      var txt = memoText(m);
      var done = function () { $('#copy-toast').textContent = '✓ Copied to clipboard'; setTimeout(function () { $('#copy-toast').textContent = ''; }, 2500); };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt); done(); });
      else { fallbackCopy(txt); done(); }
    });
  }
  function fallbackCopy(txt) {
    var ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) { /* ignore */ } document.body.removeChild(ta);
  }
  function memoText(m) {
    var L2 = [];
    L2.push('To: ML lead, Northwind AI', 'From: Delivery team', 'Project: Assistant response quality, batch 3', 'Re: ' + m.subject, '');
    L2.push('WHAT WE CHECKED', m.checked, '');
    L2.push('WHAT WE FOUND'); m.findings.forEach(function (x, i) { L2.push((i + 1) + '. ' + x); }); L2.push('');
    L2.push('WHAT WE’RE DOING ABOUT IT'); m.actions.forEach(function (x) { L2.push('- ' + x); }); L2.push('');
    L2.push('IMPACT ON YOUR DATA');
    L2.push(num(m.impact.affected) + ' of ' + num(m.impact.total) + ' ratings (' + pct(m.impact.share) + ') will be replaced: ' + num(m.impact.byReason.rushing) + ' from ' + RU + ', ' + num(m.impact.byReason.drift) + ' from ' + DR + ' after item ' + dSt.breakPoint + ', and ' + num(m.impact.byReason.tone) + ' tone ratings. The other ' + num(m.impact.kept) + ' ratings stay as delivered.');
    L2.push('Expected reliability (Krippendorff’s alpha), now → after fixes:');
    m.afterRows.forEach(function (r) { L2.push('  ' + r.label + ': ' + f2(r.now) + ' → ' + f2(r.after) + (r.projected ? ' (projected)' : '')); });
    L2.push(m.interim, '');
    L2.push('TIMELINE', m.timeline, '');
    L2.push('ONE QUESTION FOR YOU', m.question);
    return L2.join('\n');
  }

  /* ================= VIEW 5: METHODOLOGY ================= */
  function renderMethod() {
    var h = '<div class="prose"><h2>Methodology</h2><p class="lede">How the data was made, what each number means, and where the numbers can mislead.</p>' +
      '<h3>Dataset (synthetic, stated openly)</h3>' +
      '<p>Every item, rater and rating is synthetic demo data, generated in the browser with a seeded PRNG (mulberry32, seed ' + E.SEED + '), so every load shows the same numbers. Northwind AI is a fictional customer. The batch has ' + data.items.length + ' prompt/response items across 5 categories, with ' + M.goldCount + ' gold items. Six raters each rate every item on 4 dimensions (1–5), in the same order (sequence index 1–240). ' + data.items.filter(function (i) { return i.written; }).length + ' items have hand-written text; the rest show a placeholder label.</p>' +
      '<p>Each item has a latent true score per dimension. A normal rater’s score is the true score + a fixed rater bias (±0.3) + Gaussian noise (SD ' + E.NOISE_SD + '), rounded and clamped to 1–5. Normal raters take about 45–58 s per item (log-normal). Gold items are deliberately clear-cut (true scores near 1 or 5). Three problems are planted:</p>' +
      '<ul><li><b>Drift (R4):</b> matches the group until item ' + (E.DRIFT_START - 1) + ', then +' + E.DRIFT_SHIFT + ' on every dimension.</li>' +
      '<li><b>Rushing (R6):</b> median ~9 s per item; scores are 30% true score + 70% noise around 3.5, so mostly 3s and 4s.</li>' +
      '<li><b>Ambiguous tone:</b> on advice and creative writing items, R1 and R3 judge against a professional setting while R2 and R5 judge against the user’s situation. R4 has no consistent reading.</li></ul>' +
      '<p>The detection rules below don’t know about these settings. They only see the ratings.</p>' +
      '<h3>Metrics</h3><table><thead><tr><th>Metric</th><th>Definition</th></tr></thead><tbody>' +
      '<tr><td>Krippendorff’s α</td><td>Interval metric, δ = (a − b)². α = 1 − D<sub>o</sub>/D<sub>e</sub>, computed per dimension, and overall with each item × dimension as a unit. Handles missing ratings, which is how “after” excludes held-out ratings. Treating a 1–5 Likert scale as interval is a common, defensible choice; ordinal α would be a reasonable alternative. <code>selfTest()</code> checks the implementation against a 3-unit hand-computed example (α = 0.8276) and the published 4-coder example in Krippendorff (2011) (interval α = 0.849, nominal α = 0.743).</td></tr>' +
      '<tr><td>Cohen’s κ (quadratic)</td><td>Pairwise between raters, fixed 1–5 categories, weights (i − j)².</td></tr>' +
      '<tr><td>Rater vs consensus</td><td>Pearson r between a rater’s scores and the leave-one-out mean of the other five raters.</td></tr>' +
      '<tr><td>Gold accuracy</td><td>Share of gold ratings within ±1 of the gold score, plus mean absolute error.</td></tr>' +
      '<tr><td>Drift</td><td>Per item: share of the 4 dimensions within ±' + E.RULES.agreeTolerance + ' of the leave-one-out mean. Plotted as a trailing ' + E.RULES.windowSize + '-item rolling mean. The break point is the two-segment least-squares split of the rater’s signed deviation from consensus.</td></tr>' +
      '<tr><td>Speed</td><td>Median seconds per item; the group median is the median of rater medians.</td></tr></tbody></table>' +
      '<h3>Thresholds and flag rules</h3><ul>' +
      '<li><b>Reliability bands:</b> α ≥ 0.80 reliable, 0.667–0.80 tentative, &lt; 0.667 unreliable. These are Krippendorff’s conventional cut-offs (Krippendorff, <i>Content Analysis</i>, 2004/2018: rely on α ≥ .800, draw only tentative conclusions for .667 ≤ α &lt; .800).</li>' +
      '<li><b>Drift:</b> rolling agreement more than ' + E.RULES.driftDrop.toFixed(2) + ' below the rater’s own first-half baseline for ≥ ' + E.RULES.driftRun + ' consecutive items. Comparing a rater to their own baseline separates drift from a rater who is simply noisier.</li>' +
      '<li><b>Rushing:</b> median time &lt; ' + pct(E.RULES.rushTimeRatio) + ' of the group median <b>and</b> gold accuracy &lt; ' + pct(E.RULES.rushGoldAcc) + '. Requiring both avoids flagging raters who are fast and accurate.</li>' +
      '<li><b>Ambiguous dimension:</b> α &lt; ' + E.RULES.ambiguousAlpha + ' while every other dimension is ≥ ' + E.RULES.ambiguousOthers + '. The same raters are reliable elsewhere, so the guideline is the likely cause.</li></ul>' +
      '<h3>Limitations</h3><ul>' +
      '<li>The interval assumption treats 1→2 and 4→5 as equal steps. Raters may not.</li>' +
      '<li>Leave-one-out consensus isn’t ground truth. If most raters share a bias, consensus inherits it, and only gold catches that.</li>' +
      '<li>' + M.goldCount + ' gold items (' + M.goldCount * 4 + ' ratings per rater) gives a coarse accuracy estimate: one rating is ~' + (100 / (M.goldCount * 4)).toFixed(1) + ' points. A production gold set should be larger and refreshed so raters can’t memorize it.</li>' +
      '<li>The drift detector uses a trailing window, so it fires ~' + (dSt && dSt.driftRunStart ? dSt.driftRunStart - dSt.breakPoint : 30) + ' items after a break. The change-point estimate locates the break after the fact.</li>' +
      '<li>The projected tone α assumes raters apply the revised guideline consistently. It should be replaced with the real re-rated number.</li></ul>' +
      '<h3>How I’d build this for real</h3>' +
      '<p>I’d run these checks continuously while a project is live, not after delivery. Agreement over time becomes a number the delivery team watches daily, like an SLO. Drift and rushing raise alerts within a few dozen items, while the affected work is still small and cheap to redo.</p>' +
      '<p>For guideline problems, I’d make live LLM calls to draft revisions, using the high-disagreement items as context. A human (the project lead, and the customer for anything that changes the meaning of a label) approves every change before raters see it. Each approved version is logged, so every rating can be traced to the guideline it was made under.</p>' +
      '<p>Flagged ratings would be routed to re-queue or adjudication, never silently deleted. The customer should be able to see what changed and why, and the original ratings stay available for audit.</p>' +
      '<p>To show a fix worked, I’d measure three things: α recovery on the next batch for the affected dimension, gold accuracy for recalibrated raters, and the customer’s own model metrics, such as reward-model accuracy on a held-out preference set or eval scores after training on the corrected data. The first two prove the data improved. Only the third proves it mattered.</p>' +
      '<p>Before building it, I’d validate a few things with customers: which reliability thresholds they actually gate training on, whether they want flagged data held back or delivered with annotations, how much re-rating latency they’ll accept, and who on their side owns rubric decisions like the tone question.</p>' +
      '</div>';
    $('#view-method').innerHTML = h;
  }

  renderOverview(); renderRaters(); renderRubric(); renderSummary(); renderMethod();
  show((location.hash || '#overview').slice(1));
  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });
})();

</script>
